<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Precificação Mercado Livre</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f4f5;--card:#fff;--bd:#e4e4e7;--tx:#18181b;--mu:#71717a;--y:#ffe600;--yt:#18181b;--ok:#16a34a;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e10;--card:#18181b;--bd:#2e2e33;--tx:#f4f4f5;--mu:#a1a1aa;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e0e10;--card:#18181b;--bd:#2e2e33;--tx:#f4f4f5;--mu:#a1a1aa;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.in{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 10px}.in:focus{outline:2px solid var(--y)}
.btn{background:var(--y);color:var(--yt);font-weight:600;border-radius:8px;padding:8px 14px}
.btn2{border:1px solid var(--bd);border-radius:8px;padding:7px 12px;color:var(--tx)}
.lbl{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.h{font-size:22px;font-weight:700;margin-bottom:14px}
.nv{display:flex;gap:8px;padding:8px 10px;border-radius:8px;white-space:nowrap;color:var(--mu);font-weight:500}.nv.on{background:var(--y);color:var(--yt)}
aside{border-radius:0;border-width:0 0 1px 0}@media(min-width:768px){aside{border-width:0 1px 0 0}}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mu);text-align:left;font-weight:500}th,td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.warn{background:#fff7cc;color:#533;border-radius:10px;padding:10px 12px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:60}
.pr,#pf{display:none}
@media print{
:root,:root:not([data-theme=light]){--bg:#fff!important;--card:#fff!important;--tx:#000!important;--mu:#444!important;--bd:#999!important;color-scheme:light!important}
body{background:#fff!important;font-size:11px}
aside,.np,#ov,#toast,main button{display:none!important}
.pr{display:flex!important;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:12px}
main{padding:0!important;max-width:none!important}
.card{border:1px solid #bbb!important;break-inside:avoid-page}
table{font-size:10px}th,td{padding:4px 6px!important;white-space:normal!important}
.warn{border:1px solid #999}
body.pfm main,body.pfm aside{display:none!important}body.pfm #pf{display:block!important}
.bf th,.bf td{border:1px solid #000!important;color:#000!important}.bf td{height:30px}
}
.tb{padding:6px 12px;border-radius:8px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap;font-weight:500}.tb.on{background:var(--y);color:var(--yt);border-color:var(--y);font-weight:600}

<script>
const $=s=>document.querySelector(s),M=$('#main'),css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';
const pct=n=>isFinite(n)?(n*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':'—';
const num=v=>{v=String(v??'').trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isNaN(n)?0:n};
const sv=(v,t)=>t?esc(v):v?String(v).replace('.',','):'';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
